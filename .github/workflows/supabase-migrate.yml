name: Supabase Migrate

on:
  push:
    branches: [dev, main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - main

concurrency:
  group: supabase-migrate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Push migrations (${{ github.event.inputs.target || github.ref_name }})
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve target project
        id: target
        run: |
          TARGET="${{ github.event.inputs.target || github.ref_name }}"
          if [ "$TARGET" = "main" ]; then
            echo "project_ref=dkmspxwhoojpypudcedz" >> "$GITHUB_OUTPUT"
            echo "env_label=production" >> "$GITHUB_OUTPUT"
          elif [ "$TARGET" = "dev" ]; then
            echo "project_ref=gngcxcesnsufassgvccg" >> "$GITHUB_OUTPUT"
            echo "env_label=development" >> "$GITHUB_OUTPUT"
          else
            echo "::error ::Unknown target branch '$TARGET' — expected dev or main"
            exit 1
          fi

      - name: Link Supabase project (${{ steps.target.outputs.env_label }})
        run: supabase link --project-ref ${{ steps.target.outputs.project_ref }}
        env:
          SUPABASE_DB_PASSWORD: ${{ (github.event.inputs.target || github.ref_name) == 'main' && secrets.SUPABASE_DB_PASSWORD_PROD || secrets.SUPABASE_DB_PASSWORD_DEV }}

      - name: List pending migrations
        run: supabase migration list
        env:
          SUPABASE_DB_PASSWORD: ${{ (github.event.inputs.target || github.ref_name) == 'main' && secrets.SUPABASE_DB_PASSWORD_PROD || secrets.SUPABASE_DB_PASSWORD_DEV }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ (github.event.inputs.target || github.ref_name) == 'main' && secrets.SUPABASE_DB_PASSWORD_PROD || secrets.SUPABASE_DB_PASSWORD_DEV }}
