# Web (Next.js dev) 컨테이너만 정의.
# Supabase 는 supabase CLI (`supabase start`) 가 자체 docker stack 을 관리한다.
# `make up` 이 두 stack 을 순차 기동.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: todo-list-web
    working_dir: /workspace
    command: pnpm --filter @todo-list/web dev
    ports:
      - "3000:3000"
    env_file:
      # CLAUDE.md §환경 변수 관리 — 통합 env 파일 단일 SoT
      - path: env/.env.local
        required: false
    extra_hosts:
      # 컨테이너 안에서 호스트의 supabase docker stack (54321) 으로 접근
      - "host.docker.internal:host-gateway"
    volumes:
      # workspace 전체 bind mount
      - .:/workspace
      # node_modules 는 anonymous volume 으로 마스킹 (호스트 macOS arm64 ↔ 컨테이너 linux 충돌 방지)
      - /workspace/node_modules
      - /workspace/apps/web/node_modules
      - /workspace/apps/mobile/node_modules
      - /workspace/packages/core/node_modules
      - /workspace/packages/ui/node_modules
      - /workspace/packages/shared/node_modules
      - /workspace/packages/config/node_modules
      # Next.js 빌드 캐시도 컨테이너 내부 격리
      - /workspace/apps/web/.next
      - /workspace/.turbo
    tty: true
    stdin_open: true
    restart: unless-stopped
